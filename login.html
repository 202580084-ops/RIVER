<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Riverleaf Cafe</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

<main class="account">

    <!-- LEFT SIDE -->
    <section class="account-image login-image">

        <div class="account-shade"></div>

        <div class="account-top">
            <a href="landing.html">← BACK TO LANDING</a>
        </div>

        <div class="account-brand">
            <span>🍃</span>
            RIVERLEAF
        </div>

        <div class="account-copy">

            <p class="account-small">
                WELCOME BACK
            </p>

            <h1>
                Your table<br>
                is waiting.
            </h1>

            <div class="account-line"></div>

            <p class="account-script">
                coffee tastes better here.
            </p>

        </div>

        <div class="account-bottom">
            COFFEE · FOOD · PASTRIES
        </div>

    </section>


    <!-- RIGHT SIDE -->
    <section class="account-form">

        <div class="form-box">

            <div class="form-heading">

                <h2>
                    Welcome back
                </h2>

                <p class="sub">
                    Sign in to continue to your cozy coffee corner.
                </p>

            </div>


            <form action="home.html" method="get">

                <div class="input-group">

                    <label for="username">
                        USERNAME
                    </label>

                    <div class="input-wrapper">
                        <span>♙</span>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            required
                        >
                    </div>

                </div>


                <div class="input-group">

                    <label for="password">
                        PASSWORD
                    </label>

                    <div class="input-wrapper">
                        <span>●</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                </div>


                <div class="form-options">

                    <label class="remember">
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <button type="submit" class="form-button">
                    <span>ENTER THE CAFE</span>
                    <span>→</span>
                </button>

            </form>


            <div class="form-divider">
                <span>OR</span>
            </div>


            <div class="form-bottom">
                Don't have an account?
                <a href="register.html">
                    Create one
                </a>
            </div>


            <div class="form-footer">
                🍃 Take a seat. Stay awhile.
            </div>

        </div>

    </section>

</main>

</body>
</html>
