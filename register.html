<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Riverleaf Cafe</title>

  
</head>

<body>

    <div class="register-container">

        <!-- LEFT SIDE -->
        <div class="register-left">

            <div class="logo">
                <span>🍃</span> RIVERLEAF
            </div>

            <h1>Welcome to<br>Riverleaf</h1>

            <div class="leaf-line"></div>

            <p>
                Create your account and become part of
                the Riverleaf Cafe community.
            </p>

            <p style="margin-top: 20px;">
                Good coffee. Good food. Good people.
            </p>

        </div>


        <!-- RIGHT SIDE -->
        <div class="register-right">

            <h2>Create Account</h2>

            <p class="subtitle">
                Register to get started with Riverleaf Cafe.
            </p>

            <form action="#" method="POST">

                <div class="form-row">

                    <div class="form-group">
                        <label for="firstname">First Name</label>
                        <input
                            type="text"
                            id="firstname"
                            name="firstname"
                            placeholder="Enter your first name"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="lastname">Last Name</label>
                        <input
                            type="text"
                            id="lastname"
                            name="lastname"
                            placeholder="Enter your last name"
                            required>
                    </div>

                </div>


                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>
                </div>


                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        required>
                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Confirm password"
                            required>
                    </div>

                </div>


                <div class="terms">
                    <input type="checkbox" id="terms" required>

                    <label for="terms">
                        I agree to the
                        <a href="#">Terms & Conditions</a>
                    </label>
                </div>


                <button type="submit" class="register-btn">
                    CREATE ACCOUNT
                </button>

            </form>


            <p class="login-text">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </div>

    </div>

</body>
</html>
